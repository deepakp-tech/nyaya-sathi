# ---------------------------------------------------------------------
- id: T33
  category: voice
  description: Hindi voice note about unpaid salary
  audio: tests/audio/t33_hindi_salary.wav
  turns: []   # transcript produced by STT
  expected:
    category_expected: employment
    language_expected: hi
    notes: "Record yourself. Save STT transcript + final reply in raw output."
